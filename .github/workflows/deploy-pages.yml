# 部署 TEAM JBYangC 战队官网到 GitHub Pages
#
# 本工作流把仓库里的 site\ 子目录作为整站发布出去。
# 因为站内全部是相对路径、没有构建步骤，所以不需要 npm install / build，
# 只需要：自检 → 打包 site\ → 发布。
#
# 首次使用：仓库 Settings → Pages → Source 选择 "GitHub Actions"。
# 之后每次推送到 main 分支（且改动涉及 site\）就会自动重新发布。

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '_build/verify.js'
      - '.github/workflows/deploy-pages.yml'
  # 允许在 Actions 页面手动点一次发布
  workflow_dispatch:

# Pages 部署所需的最小权限集
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布；已在跑的就让它跑完，不中途取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 自检并打包
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 拦住「素材引用指向不存在的文件」这类错误，
      # 否则线上会静默显示占位图而不是报错。
      - name: 上线前自检（语法 / 素材引用 / 各页渲染）
        run: node _build/verify.js

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点目录
        uses: actions/upload-pages-artifact@v3
        with:
          # 关键：只发布 site\ 子目录，它是唯一源
          path: site

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
