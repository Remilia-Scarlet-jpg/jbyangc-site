# 部署 TEAM JBYangC 战队官网到 GitHub Pages
#
# 站点已迁移到 Astro（app\ 目录），所以流程是：
#   npm ci → astro build → 发布 app\dist
#
# 注意：旧的纯静态站仍在 site\ 里，但不再参与部署。
# 等线上确认无误后可以删掉，删之前它是唯一的回退方案。
#
# 首次使用：仓库 Settings → Pages → Source 选择 "GitHub Actions"。

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '_build/check-budget.js'
      - '.github/workflows/deploy-pages.yml'
  # 允许在 Actions 页面手动点一次发布
  workflow_dispatch:

# Pages 部署所需的最小权限集
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布；已在跑的就让它跑完，不中途取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # Astro 7 需要较新的 Node；22 是当前 LTS
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      # ci 而不是 install：锁定 package-lock.json，构建可重现
      - name: 安装依赖
        working-directory: app
        run: npm ci

      - name: 构建站点
        working-directory: app
        run: npm run build

      # 检查构建产物的体积，而不是源码 —— 线上真正传输的是 dist
      - name: 性能预算检查
        run: node _build/check-budget.js --dir app/dist

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点目录
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发布构建产物
          path: app/dist

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
